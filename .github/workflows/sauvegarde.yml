# Sauvegarde chiffree de toute la base (y compris les fichiers stockes dedans),
# chaque nuit a 2 h (heure d'Abidjan), gardee 14 jours dans l'onglet Actions.
# Secrets a creer dans GitHub > Settings > Secrets and variables > Actions :
#   DATABASE_URL       adresse Neon (la meme que sur Render)
#   BACKUP_PASSPHRASE  mot de passe de chiffrement (a garder precieusement)
# Restauration : voir SAUVEGARDES.md
name: Sauvegarde de la base

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Verifier les secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Secrets DATABASE_URL et BACKUP_PASSPHRASE manquants (voir SAUVEGARDES.md)"
            exit 1
          fi
      - name: Exporter la base (pg_dump 18)
        run: |
          docker run --rm -e DATABASE_URL postgres:18 \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges' > linkci.dump
          test -s linkci.dump
          ls -lh linkci.dump
      - name: Chiffrer (AES-256)
        run: |
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
              --passphrase "$BACKUP_PASSPHRASE" -o linkci.dump.gpg linkci.dump
          rm -f linkci.dump
      - name: Conserver 14 jours
        uses: actions/upload-artifact@v4
        with:
          name: linkci-sauvegarde-${{ github.run_number }}
          path: linkci.dump.gpg
          retention-days: 14
