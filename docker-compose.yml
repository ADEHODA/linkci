version: "3.9"
services:
  linkci:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://linkci:linkci@db:5432/linkci}
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=linkci
      - POSTGRES_PASSWORD=linkci
      - POSTGRES_DB=linkci
    volumes:
      - linkci_pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  linkci_pg:
