{% extends 'base_app.html' %}
{% block titre %}Modifier profil{% endblock %}
{% block styles_anciens %}<link rel="stylesheet" href="/static/css/style.css">{% endblock %}
{% block contenu %}
<div class="container" style="max-width:600px;">
        <div class="card">
            <h2 style="margin-bottom:1.5rem;">Modifier mon profil</h2>
            <form method="POST" class="auth-form" enctype="multipart/form-data">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div style="text-align:center;margin-bottom:1.5rem;">
                    <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--green));color:white;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;margin:0 auto 0.5rem;">{{ user.prenom[:1] }}{{ user.nom[:1] }}</div>
                    <label style="font-size:0.8rem;color:var(--orange);cursor:pointer;text-decoration:underline;">
                        Changer la photo
                        <input type="file" name="avatar" accept="image/png,image/jpeg,image/jpg,image/gif" style="display:none;" onchange="this.form.submit()">
                    </label>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Prenom</label>
                        <input type="text" name="prenom" value="{{ user.prenom }}" required>
                    </div>
                    <div class="form-group">
                        <label>Nom</label>
                        <input type="text" name="nom" value="{{ user.nom }}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Universite</label>
                    <input type="text" name="universite" value="{{ user.universite or '' }}" list="universites">
                    <datalist id="universites">
                        <option value="UFHB (Universite Felix Houphouet-Boigny)">
                        <option value="INPHB (Institut National Polytechnique)">
                        <option value="Universite Nangui Abrogoua">
                        <option value="Universite Alassane Ouattara">
                        <option value="Universite Peleforo Gon Coulibaly">
                        <option value="Universite Jean Lorougnon Guede">
                        <option value="Universite de Man">
                        <option value="Universite de San Pedro">
                        <option value="ESMIC">
                        <option value="ESATIC">
                    </datalist>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Filiere</label>
                        <input type="text" name="filiere" value="{{ user.filiere or '' }}" placeholder="Informatique, Droit, Medecine...">
                    </div>
                    <div class="form-group">
                        <label>Annee</label>
                        <select name="annee">
                            <option value="">Selectionner</option>
                            <option value="Licence 1" {% if user.annee == 'Licence 1' %}selected{% endif %}>Licence 1</option>
                            <option value="Licence 2" {% if user.annee == 'Licence 2' %}selected{% endif %}>Licence 2</option>
                            <option value="Licence 3" {% if user.annee == 'Licence 3' %}selected{% endif %}>Licence 3</option>
                            <option value="Master 1" {% if user.annee == 'Master 1' %}selected{% endif %}>Master 1</option>
                            <option value="Master 2" {% if user.annee == 'Master 2' %}selected{% endif %}>Master 2</option>
                            <option value="Doctorat" {% if user.annee == 'Doctorat' %}selected{% endif %}>Doctorat</option>
                            <option value="BTS" {% if user.annee == 'BTS' %}selected{% endif %}>BTS</option>
                            <option value="Cycle Ingenieur" {% if user.annee == 'Cycle Ingenieur' %}selected{% endif %}>Cycle Ingenieur</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea name="bio" rows="3" placeholder="Parle un peu de toi...">{{ user.bio or '' }}</textarea>
                </div>
                <div class="form-group">
                    <label>Photo de couverture</label>
                    <input type="file" name="couverture" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Competences <small>(separees par des virgules, 15 max)</small></label>
                    <input name="competences" value="{{ competences }}" placeholder="Python, Excel, Prise de parole" maxlength="600">
                </div>
                <div class="form-group">
                    <label>Parcours <small>(une ligne par etape : titre | lieu | periode)</small></label>
                    <textarea name="parcours" rows="3" placeholder="Licence Informatique | UFHB | 2023-2026">{{ parcours }}</textarea>
                </div>
                <div class="form-group"><label>LinkedIn</label><input name="lien_linkedin" type="url" value="{{ user.lien_linkedin or '' }}" placeholder="https://www.linkedin.com/in/..."></div>
                <div class="form-group"><label>GitHub</label><input name="lien_github" type="url" value="{{ user.lien_github or '' }}" placeholder="https://github.com/..."></div>
                <div class="form-group"><label>Site web</label><input name="lien_site" type="url" value="{{ user.lien_site or '' }}" placeholder="https://..."></div>
                <button type="submit" class="btn-primary-solid" style="width:100%;padding:0.8rem;">Enregistrer</button>
            </form>
            <div style="margin-top:1rem;text-align:center;">
                <a href="/profil/{{ user.id }}" style="color:var(--text-light);font-size:0.9rem;">&larr; Retour au profil</a>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
<script src="/static/js/app.js"></script>
{% endblock %}
