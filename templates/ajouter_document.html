{% extends 'base_app.html' %}
{% block titre %}Partager un document{% endblock %}
{% block styles_anciens %}<link rel="stylesheet" href="/static/css/style.css">{% endblock %}
{% block tete %}
<style>
        .upload-page { max-width: 600px; margin: 0 auto; padding: 2rem 1rem; }
        .upload-page h2 { margin-bottom: 1.5rem; }
        .upload-page label { font-size: 0.825rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-secondary); display: block; }
        .upload-page input, .upload-page textarea, .upload-page select { width: 100%; padding: 0.65rem 0.85rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit; background: #FAFAF8; margin-bottom: 1rem; }
        .upload-page input:focus, .upload-page textarea:focus, .upload-page select:focus { outline: none; border-color: var(--orange); }
        .upload-page input[type="file"] { padding: 0.5rem; background: var(--card); }
        .upload-page .btn-primary { width: 100%; padding: 0.75rem; font-size: 1rem; }
    </style>
{% endblock %}
{% block contenu %}
<div class="upload-page">
        <h2>📤 Partager un document</h2>
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <label>Titre du document *</label>
            <input type="text" name="titre" required placeholder="ex: Cours de maths S1">

            <label>Description</label>
            <textarea name="description" rows="3" placeholder="Description du document..."></textarea>

            <label>Matière</label>
            <input type="text" name="matiere" placeholder="ex: Mathématiques, Physique...">

            <label>Université</label>
            <input type="text" name="universite" placeholder="ex: UFHB, INPHB...">

            <label>Fichier * (PDF, Word, PowerPoint, TXT, ZIP, images)</label>
            <input type="file" name="fichier" required accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.zip,.rar,.png,.jpg,.jpeg">

            <button type="submit" class="btn-primary">Publier le document</button>
        </form>
        <p style="margin-top:1rem;font-size:0.85rem;color:var(--text-muted);">En partageant, tu aides d'autres étudiants ivoiriens à réussir !</p>
    </div>
{% endblock %}
