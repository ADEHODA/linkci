{% extends 'base_app.html' %}
{% block titre %}Ajouter une formation{% endblock %}
{% block styles_anciens %}<link rel="stylesheet" href="/static/css/style.css">{% endblock %}
{% block contenu %}
<div class="container" style="max-width:600px;">
        <h2>Ajouter une formation</h2>
        <form method="POST" class="card">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div style="margin-bottom:0.75rem;">
                <label>Nom de la formation *</label>
                <input type="text" name="nom" required style="width:100%;padding:0.5rem;border:1px solid #ddd;border-radius:8px;">
            </div>
            <div style="margin-bottom:0.75rem;">
                <label>Universite *</label>
                <input type="text" name="universite" list="universites" required placeholder="UFHB, INPHB, etc." style="width:100%;padding:0.5rem;border:1px solid #ddd;border-radius:8px;">
                <datalist id="universites">
                    <option value="UFHB (Universite Felix Houphouet-Boigny)">
                    <option value="INPHB (Institut National Polytechnique)">
                    <option value="Universite Nangui Abrogoua">
                    <option value="Universite Alassane Ouattara">
                    <option value="Universite Peleforo Gon Coulibaly">
                    <option value="Universite Jean Lorougnon Guede">
                    <option value="Universite de Man">
                    <option value="Universite de San Pedro">
                    <option value="ESMIC (Ecole Superieure Multinationale)">
                    <option value="ESATIC (Ecole Superieire Africaine des TIC)">
                </datalist>
            </div>
            <div style="margin-bottom:0.75rem;">
                <label>Niveau *</label>
                <select name="niveau" required style="width:100%;padding:0.5rem;border:1px solid #ddd;border-radius:8px;">
                    <option value="">Selectionner</option>
                    <option value="Licence 1">Licence 1</option>
                    <option value="Licence 2">Licence 2</option>
                    <option value="Licence 3">Licence 3</option>
                    <option value="Master 1">Master 1</option>
                    <option value="Master 2">Master 2</option>
                    <option value="Doctorat">Doctorat</option>
                    <option value="BTS">BTS</option>
                    <option value="DUT">DUT</option>
                    <option value="Cycle Ingenieur">Cycle Ingenieur</option>
                </select>
            </div>
            <div style="margin-bottom:0.75rem;">
                <label>Duree</label>
                <input type="text" name="duree" placeholder="3 ans, 2 ans, etc." style="width:100%;padding:0.5rem;border:1px solid #ddd;border-radius:8px;">
            </div>
            <div style="margin-bottom:0.75rem;">
                <label>Frais de scolarite</label>
                <input type="text" name="frais" placeholder="Gratuit / 500 000 FCFA / an" style="width:100%;padding:0.5rem;border:1px solid #ddd;border-radius:8px;">
            </div>
            <div style="margin-bottom:0.75rem;">
                <label>Site web</label>
                <input type="url" name="site_web" placeholder="https://..." style="width:100%;padding:0.5rem;border:1px solid #ddd;border-radius:8px;">
            </div>
            <div style="margin-bottom:0.75rem;">
                <label>Description</label>
                <textarea name="description" rows="4" placeholder="Decrivez la formation..." style="width:100%;padding:0.5rem;border:1px solid #ddd;border-radius:8px;"></textarea>
            </div>
            <div style="margin-bottom:0.75rem;">
                <label>Debouches</label>
                <textarea name="debouches" rows="3" placeholder="Quels metiers apres cette formation ?" style="width:100%;padding:0.5rem;border:1px solid #ddd;border-radius:8px;"></textarea>
            </div>
            <button type="submit" style="width:100%;padding:0.7rem;background:var(--primary);color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer;">Publier la formation</button>
        </form>
    </div>
{% endblock %}
{% block scripts %}
<script src="/static/js/app.js"></script>
{% endblock %}
