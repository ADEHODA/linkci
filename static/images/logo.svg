<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E85D26"/>
    </linearGradient>
    <linearGradient id="ci-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E85D26"/>
    </linearGradient>
  </defs>

  <!-- Icon: L stylisé + toque -->
  <g transform="translate(4,4)">
    <!-- Fond arrondi -->
    <rect x="0" y="0" width="62" height="62" rx="16" fill="url(#bg)" filter="drop-shadow(2px 3px 6px rgba(0,0,0,0.15))"/>

    <!-- Cercle intérieur -->
    <circle cx="31" cy="31" r="22" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

    <!-- Points de connexion (réseau) -->
    <circle cx="16" cy="14" r="2.5" fill="white"/>
    <circle cx="46" cy="14" r="2.5" fill="white"/>
    <circle cx="16" cy="48" r="2.5" fill="white"/>
    <circle cx="46" cy="48" r="2.5" fill="white"/>
    <circle cx="31" cy="31" r="3" fill="white"/>

    <!-- Lignes de connexion -->
    <line x1="16" y1="14" x2="46" y2="14" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="16" y1="14" x2="31" y2="31" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="46" y1="14" x2="31" y2="31" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="16" y1="48" x2="31" y2="31" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="46" y1="48" x2="31" y2="31" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="16" y1="14" x2="16" y2="48" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="46" y1="14" x2="46" y2="48" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Lettre L stylisée -->
    <text x="31" y="40" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">L</text>
  </g>

  <!-- Texte INK -->
  <text x="76" y="36" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="#FF6B35" letter-spacing="0.5">INK</text>

  <!-- Sous-titre -->
  <text x="76" y="56" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#888" letter-spacing="2.5">CÔTE D'IVOIRE</text>

  <!-- Drapeau CI discret -->
  <rect x="222" y="18" width="4" height="36" rx="1" fill="#FF6B35"/>
  <rect x="222" y="18" width="4" height="36" fill="url(#ci-orange)" opacity="0"/>
  <rect x="226" y="18" width="4" height="36" rx="1" fill="white"/>
  <rect x="230" y="18" width="4" height="36" rx="1" fill="#009D54"/>
</svg>
