services:
  - type: web
    name: linkci
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 seul worker (Socket.IO garde les salles en memoire) + threads pour la concurrence
    startCommand: gunicorn -w 1 --threads 50 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /connexion
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Chaine de connexion Neon (postgresql://...?sslmode=require), a saisir dans le dashboard
      - key: DATABASE_URL
        sync: false
      # E-mails (mot de passe oublie) : script Google qui envoie depuis Gmail
      # (outils/gmail_relais.gs), ou Brevo ; Render gratuit bloque les ports SMTP
      - key: GMAIL_SCRIPT_URL
        sync: false
      - key: GMAIL_SCRIPT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_EXPEDITEUR
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
